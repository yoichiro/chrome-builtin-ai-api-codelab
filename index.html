<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>こんにちは、世界</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="main.js"></script>
  </head>
  <body>
    <header class="page-header">
      <h1>Chrome Built-in AI API Codelab</h1>
    </header>
    <main class="page-main">
      <button id="start-button" type="button" hidden>
        AIモデルの準備を開始
      </button>
      <div id="downloading-message" hidden>
        モデルのダウンロード中: <span id="download-progress">0</span>%
      </div>
      <div id="main-content" hidden>
        <div class="columns">
          <section class="panel">
            <h2 class="panel-title">受信メッセージの解析</h2>
            <div class="field">
              <label for="output-message">受信したメッセージ</label>
              <textarea id="output-message"></textarea>
            </div>
            <button id="analyze-button" type="button">解析する</button>
            <div class="field">
              <label for="summary-result">要点</label>
              <textarea id="summary-result" readonly></textarea>
            </div>
            <div class="field">
              <label>送信者の感情</label>
              <div id="emotion-result" class="emotion-display"></div>
            </div>
          </section>
          <section class="panel">
            <h2 class="panel-title">返信メッセージの作成</h2>
            <div class="field">
              <label for="input-message">送信するメッセージ</label>
              <textarea id="input-message"></textarea>
            </div>
            <button id="format-button" type="button">ビジネス文書化</button>
            <div class="field field--grow">
              <label for="business-message">ビジネス文書としての文面</label>
              <textarea id="business-message" readonly></textarea>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>

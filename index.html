<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Chrome Built-in AI API Codelab</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="main.js"></script>
  </head>
  <body>
    <header class="page-header">
      <h1>Chrome Built-in AI API Codelab</h1>
    </header>
    <main class="page-main">
      <button id="start-button" type="button" hidden>
        Start preparing AI models
      </button>
      <div id="downloading-message" hidden>
        Downloading models: <span id="download-progress">0</span>%
      </div>
      <div id="main-content" hidden>
        <div class="columns">
          <section class="panel">
            <h2 class="panel-title">Analyze incoming message</h2>
            <div class="field">
              <label for="output-message">Received message</label>
              <textarea id="output-message"></textarea>
            </div>
            <button id="analyze-button" type="button">Analyze</button>
            <div class="field">
              <label for="summary-result">Key points</label>
              <textarea id="summary-result" readonly></textarea>
            </div>
            <div class="field">
              <label>Sender's emotion</label>
              <div id="emotion-result" class="emotion-display"></div>
            </div>
          </section>
          <section class="panel">
            <h2 class="panel-title">Compose reply message</h2>
            <div class="field">
              <label for="input-message">Message to send</label>
              <textarea id="input-message"></textarea>
            </div>
            <button id="format-button" type="button">Format as business writing</button>
            <div class="field field--grow">
              <label for="business-message">Business-style version</label>
              <textarea id="business-message" readonly></textarea>
            </div>
          </section>
        </div>
      </div>
    </main>
  </body>
</html>
